<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iChat Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; justify-content: center; height: 100vh; }
        .app-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #111b21; border-left: 1px solid #222d34; border-right: 1px solid #222d34; position: relative; }
        header { background: #202c33; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; }
        header h1 { font-size: 1.2rem; color: #00a884; font-weight: bold; }
        .user-info-bar { background: #111b21; padding: 8px 12px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #222d34; }
        input[type="text"] { background: #2a3942; border: none; color: #e9edef; padding: 8px 12px; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .input-id { flex: 1; }
        button { background: #00a884; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.96); }
        .call-btn { background: #008069; display: flex; align-items: center; gap: 4px; }
        .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#202c33 1px, transparent 0); background-size: 16px 16px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 0.95rem; position: relative; word-wrap: break-word; display: flex; flex-direction: column; }
        .message.sent { align-self: flex-end; background: #005c4b; color: #e9edef; border-bottom-right-radius: 2px; }
        .message.received { align-self: flex-start; background: #202c33; color: #e9edef; border-bottom-left-radius: 2px; }
        .meta { font-size: 0.65rem; color: #8696a0; align-self: flex-end; margin-top: 4px; display: flex; align-items: center; gap: 3px; }
        .footer-input { background: #202c33; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
        .footer-input input { flex: 1; background: #2a3942; border-radius: 20px; padding: 10px 16px; }
        .send-btn { border-radius: 50%; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; }
        .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .video-container.active { display: flex; }
        #remoteVideo { width: 90%; height: 60%; background: #000; border-radius: 12px; object-fit: cover; }
        #localVideo { width: 100px; height: 140px; background: #222; border-radius: 8px; position: absolute; top: 20px; right: 20px; object-fit: cover; border: 2px solid #00a884; }
        .call-controls { margin-top: 15px; display: flex; gap: 15px; }
        .end-call { background: #ea0038; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>iChat ⚡</h1>
        <span id="display-id" style="font-size:0.8rem; color:#8696a0;">ID: Not Set</span>
    </header>

    <div class="user-info-bar">
        <input type="text" id="myId" class="input-id" placeholder="Apna Name / ID rakhein...">
        <button onclick="setMyId()">Set ID</button>
    </div>

    <div class="user-info-bar">
        <input type="text" id="friendId" class="input-id" placeholder="Dost ki ID likhein...">
        <button class="call-btn" onclick="startCall()">📞 Call</button>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="footer-input">
        <input type="text" id="msgInput" placeholder="Message likhein..." onkeypress="if(event.key === 'Enter') sendMsg()">
        <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>

    <div class="video-container" id="videoContainer">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="call-controls">
            <button class="end-call" onclick="endCall()">End Call</button>
        </div>
    </div>
</div>

<script>
    let myId = '';
    let friendId = '';

    function setMyId() {
        const val = document.getElementById('myId').value.trim();
        if(val) {
            myId = val;
            document.getElementById('display-id').innerText = 'ID: ' + myId;
            alert('Aapki ID set ho gayi: ' + myId);
        }
    }

    function sendMsg() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text) return;

        appendMsg(text, 'sent');
        input.value = '';
    }

    function appendMsg(text, type) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;
        
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        msgDiv.innerHTML = `
            <div>${text}</div>
            <div class="meta">${timeStr} ${type === 'sent' ? '✓✓' : ''}</div>
        `;

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function startCall() {
        friendId = document.getElementById('friendId').value.trim();
        if(!friendId) { alert('Dost ki ID daalein!'); return; }
        document.getElementById('videoContainer').classList.add('active');
    }

    function endCall() {
        document.getElementById('videoContainer').classList.remove('active');
    }
</script>
</body>
</html>
